<h1>Editer un admin</h1>
<form [formGroup]="adminForm" (ngSubmit)="submit()">
    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" type="text" id="name" required>
        <mat-error>Required</mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" id="email" required>
        <mat-error>Required</mat-error>
    </mat-form-field><br>
    <button mat-button type="submit" [disabled]="!adminForm.valid">Editer</button>
</form>
