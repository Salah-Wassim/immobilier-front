<button mat-button [routerLink]="['/']">Retour</button>
<h1>Ajouter Annonce</h1>
<form [formGroup]="annonceForm" (ngSubmit)="submit()">
    <mat-form-field>
        <mat-label>Titre</mat-label>
        <input matInput formControlName="title" type="text" id="title" required>
        <mat-error>Required</mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Prix</mat-label>
        <input matInput formControlName="price" type="number" id="price" required>
        <mat-error>Required</mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Secteur</mat-label>
        <input matInput formControlName="secteur" type="text" id="secteur" required>
        <mat-error>Required</mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Nombre de pièce</mat-label>
        <input matInput formControlName="nbRoom" type="number" id="nbRoom" required>
        <mat-error></mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" type="text" id="description" required>
        <mat-error></mat-error>
    </mat-form-field><br>
    <mat-form-field>
        <mat-label>Image</mat-label>
        <input matInput formControlName="picture" type="text" id="picture">
        <mat-error></mat-error>
    </mat-form-field><br>
    <mat-form-field appearance="outline">
        <mat-label>Agent Immobilier</mat-label>
        <mat-select formControlName="AgentImmobilierId">
            <mat-option *ngFor="let AgentImmobilierId of AgentImmobilierIds" [value]="AgentImmobilierId.id">
                {{ AgentImmobilierId.name }}
            </mat-option>
        </mat-select>
    </mat-form-field><br>
    <mat-form-field appearance="outline">
        <mat-label>Type de bien</mat-label>
        <mat-select formControlName="BienId">
            <mat-option *ngFor="let BienId of BienIds" [value]="BienId.id">
                {{ BienId.name }}
            </mat-option>
        </mat-select>
    </mat-form-field><br>
    <mat-form-field appearance="fill">
        <mat-label>Avantage</mat-label>
        <mat-select formControlName="avantageIds" multiple>
            <mat-option *ngFor="let avantage of avantages" [value]="avantage.id">
                {{ avantage.name }}
            </mat-option>
        </mat-select>
    </mat-form-field><br>
    <mat-form-field appearance="fill">
        <mat-label>Mots clés</mat-label>
        <mat-select formControlName="keyWordIds" multiple>
            <mat-option *ngFor="let keyWord of keyWords" [value]="keyWord.id">
                {{ keyWord.name }}
            </mat-option>
        </mat-select>
    </mat-form-field><br>
    <button mat-button type="submit" [disabled]="!annonceForm.valid">Publier</button>
</form>
